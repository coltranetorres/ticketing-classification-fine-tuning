[project]
name = "h5"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm",
    "openai",
    "python-dotenv",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
